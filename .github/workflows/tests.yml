# Runs the test suite on GitHub for every push and pull request.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The default PyTorch package for Linux includes GPU (CUDA) libraries of
      # several GB. The tests only need the CPU, so install the small CPU build.
      - name: Install PyTorch (CPU only)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install the package and test dependencies
        run: pip install -e ".[dev]"

      - name: Run the tests
        run: pytest -v
